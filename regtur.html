<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</head>
<body>


    
  <style>
  .center-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
  }
  .form-block {
    width: 100%;
    max-width: 400px;
    padding: 20px;
  }
  .form-block label {
    display: block;
    margin-bottom: 8px;
    text-align: center;
  }
  .form-block input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
  }
  .form-block button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
  }
</style>

<div class="center-container">
  <div class="form-block">
    
    <label for="tur">Ваш тур</label>
    <input type="text" id="tur" name="tur" placeholder="Введите название тура" required style="margin-bottom: 10px;">   
    

    <label for="name">Ваше Имя</label>
    <input type="text" id="name" name="name" placeholder="Введите ваше имя" required style="margin-bottom: 10px;">

    <label for="phone">Телефон</label>
    <input type="text" id="phone" name="phone" placeholder="Введите ваш телефон" required>    
    <button class="btn-solid btn-styled theme-primary" onclick="window.location.href='Done.html'">Записаться</button>
  </div>
</div>




</body>
</html>
